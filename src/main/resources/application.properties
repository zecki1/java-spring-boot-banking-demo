# Configuration Properties (como no Node.js: process.env)
# Em produção (Railway) usa a variável PORT injetada pela plataforma.
server.port=${PORT:3001}
spring.application.name=spring-boot-demo
spring.mvc.problemdetails.enabled=true

# Logging configuration
logging.level.root=INFO
logging.level.com.banking.demo=DEBUG

# CORS - similar a app.use(cors({ origin: '*' })) no Express
# Mas no Spring configuramos via WebConfig.java ou @CrossOrigin

# Jackson JSON configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Swagger/OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
